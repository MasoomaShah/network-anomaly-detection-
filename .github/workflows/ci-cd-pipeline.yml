# ════════════════════════════════════════════════════════════════════════
# CI/CD Pipeline — Agentic AI Network Troubleshooter
# ════════════════════════════════════════════════════════════════════════
# Stages:
#   1. Code Quality  — lint, format, security scan
#   2. Unit Tests    — test every module in isolation
#   3. Model Check   — validate ML artifacts integrity
#   4. Integration   — end-to-end pipeline smoke test
#   5. Build Check   — Docker build + Next.js build verification
#   6. Deploy        — HF Spaces (backend) + Vercel (frontend) on main push
# ════════════════════════════════════════════════════════════════════════

name: ML Pipeline CI/CD

on:
  push:
    branches: [main, fix-branch]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 1: CODE QUALITY
  # ═══════════════════════════════════════════════════════════════════════
  code-quality:
    name: "🔍 Code Quality"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-lint-

      - name: Install linting tools
        run: pip install --upgrade pip && pip install flake8 black isort bandit safety

      - name: "Flake8 — Lint Check"
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=.git,__pycache__,models,data,.github,venv,web
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 \
            --statistics --exclude=.git,__pycache__,models,data,.github,venv,web

      - name: "Black — Format Check"
        run: |
          black --check --diff --line-length 120 \
            --exclude '/(\.git|__pycache__|models|data|venv|\.github|web)/' \
            . || echo "::warning::Run 'black .' to fix formatting"

      - name: "isort — Import Order"
        run: |
          isort --check-only --diff --profile black \
            --skip-glob '*/models/*' --skip-glob '*/data/*' \
            --skip-glob '*/venv/*' --skip-glob '*/web/*' \
            . || echo "::warning::Run 'isort .' to fix imports"

      - name: "Bandit — Security Scan"
        run: |
          bandit -r agent/ collector/ inference/ dashboard/ -ll --format json \
            --output bandit-report.json || true
          bandit -r agent/ collector/ inference/ dashboard/ -ll --format txt \
            || echo "::warning::Review bandit findings"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: bandit-report.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 2: UNIT TESTS
  # ═══════════════════════════════════════════════════════════════════════
  unit-tests:
    name: "🧪 Unit Tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: [code-quality]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-test-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-test-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-timeout

      - name: Create test data dirs
        run: python -c "import os; os.makedirs('data', exist_ok=True); os.makedirs('models', exist_ok=True)"

      - name: Run unit tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test_key_for_ci' }}
          LLM_PROVIDER: openai
        shell: bash
        run: |
          pytest tests/ -v --timeout=60 --tb=short \
            --junitxml=test-results.xml \
            --cov=agent --cov=collector --cov=inference \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing -x

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: |
            test-results.xml
            coverage.xml
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 3: MODEL VALIDATION
  # ═══════════════════════════════════════════════════════════════════════
  model-validation:
    name: "🧠 Model Validation"
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-model-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-model-

      - name: Install dependencies
        run: pip install tensorflow numpy joblib scikit-learn pytest pytest-timeout

      - name: Run model validation
        run: pytest tests/test_model_validation.py -v --timeout=120 --tb=short -x

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 4: INTEGRATION TESTS
  # ═══════════════════════════════════════════════════════════════════════
  integration-tests:
    name: "🔗 Integration Tests"
    runs-on: ubuntu-latest
    needs: [unit-tests, model-validation]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-integ-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-integ-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-timeout

      - name: Create data dir
        run: mkdir -p data

      - name: Run integration tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test_key_for_ci' }}
          LLM_PROVIDER: openai
        run: pytest tests/test_integration.py -v --timeout=120 --tb=short -x

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 5: BUILD CHECKS — Docker + Next.js
  # ═══════════════════════════════════════════════════════════════════════
  build-checks:
    name: "🏗️ Build Checks"
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - uses: actions/checkout@v4

      # ── Docker ──────────────────────────────────────────────────────
      - name: "Docker — Build backend image"
        run: |
          docker build \
            --tag network-troubleshooter-backend:ci \
            --file Dockerfile \
            --progress plain \
            .

      # ── Next.js ─────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: "Next.js — Install"
        working-directory: web
        run: npm ci

      - name: "Next.js — Build"
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: https://placeholder.example.com
        run: npm run build

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 6: DEPLOY (main push only)
  # ═══════════════════════════════════════════════════════════════════════

  # ── Backend → Hugging Face Spaces ───────────────────────────────────
  deploy-backend:
    name: "🚀 Deploy Backend → HF Spaces"
    runs-on: ubuntu-latest
    needs: [integration-tests, build-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN:      ${{ secrets.HF_TOKEN }}
          HF_USERNAME:   ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          git config user.email "ci@github.com"
          git config user.name  "GitHub CI"
          git push \
            https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME \
            HEAD:main --force
          echo "✅ Deployed to HF Space → $HF_USERNAME/$HF_SPACE_NAME"

  # ── Frontend → Vercel ───────────────────────────────────────────────
  deploy-frontend:
    name: "🚀 Deploy Frontend → Vercel"
    runs-on: ubuntu-latest
    needs: [integration-tests, build-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        working-directory: web
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  # ═══════════════════════════════════════════════════════════════════════
  # PIPELINE REPORT
  # ═══════════════════════════════════════════════════════════════════════
  pipeline-report:
    name: "📊 Pipeline Report"
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, model-validation, integration-tests, build-checks]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## 📊 Pipeline Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Code Quality     | ${{ needs.code-quality.result     == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Unit Tests       | ${{ needs.unit-tests.result       == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧠 Model Validation | ${{ needs.model-validation.result  == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔗 Integration      | ${{ needs.integration-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Build Checks     | ${{ needs.build-checks.result     == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\` | **Branch:** \`${{ github.ref_name }}\` | **Actor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
