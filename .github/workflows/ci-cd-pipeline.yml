# ════════════════════════════════════════════════════════════════════════
# CI/CD Pipeline — Agentic AI Network Troubleshooter
# ════════════════════════════════════════════════════════════════════════
# Stages:
#   1. Code Quality   — flake8, black, isort, bandit
#   2. Unit Tests     — pytest on ubuntu + windows
#   3. Model Check    — validate ML artifacts
#   4. Integration    — end-to-end pipeline smoke test
#   5a. Docker Build  — backend image (with layer cache)
#   5b. Frontend Build— Next.js npm build
#   6a. Deploy Backend → Hugging Face Spaces (main only)
#   6b. Deploy Frontend→ Vercel (main only)
# ════════════════════════════════════════════════════════════════════════

name: ML Pipeline CI/CD

on:
  push:
    branches: [main, fix-branch]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 1 — CODE QUALITY
  # ═══════════════════════════════════════════════════════════════════════
  code-quality:
    name: "🔍 Code Quality"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-lint-

      - name: Install linting tools
        run: pip install --upgrade pip flake8 black isort bandit

      - name: "Flake8 — fatal errors only (blocking)"
        run: |
          flake8 . \
            --count --select=E9,F63,F7,F82 \
            --show-source --statistics \
            --exclude=.git,__pycache__,models,data,.github,venv,web

      - name: "Flake8 — style warnings (non-blocking)"
        run: |
          flake8 . \
            --count --exit-zero \
            --max-complexity=15 --max-line-length=120 --statistics \
            --exclude=.git,__pycache__,models,data,.github,venv,web

      - name: "Black — format check (non-blocking)"
        run: |
          black --check --diff --line-length 120 \
            --exclude '/(\.git|__pycache__|models|data|venv|\.github|web)/' \
            . || echo "::warning::Run 'black .' to fix formatting"

      - name: "isort — import order (non-blocking)"
        run: |
          isort --check-only --diff --profile black \
            --skip-glob '*/models/*' --skip-glob '*/data/*' \
            --skip-glob '*/venv/*'  --skip-glob '*/web/*' \
            . || echo "::warning::Run 'isort .' to fix imports"

      - name: "Bandit — security scan (non-blocking)"
        run: |
          bandit -r agent/ collector/ inference/ dashboard/ \
            -ll --format json --output bandit-report.json || true
          bandit -r agent/ collector/ inference/ dashboard/ \
            -ll --format txt || echo "::warning::Review bandit findings"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: bandit-report.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 2 — UNIT TESTS (ubuntu + windows matrix)
  # ═══════════════════════════════════════════════════════════════════════
  unit-tests:
    name: "🧪 Unit Tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: [code-quality]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-test-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-test-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-timeout

      - name: Create required directories
        run: python -c "import os; [os.makedirs(d, exist_ok=True) for d in ['data','models']]"

      - name: Run unit tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' && secrets.OPENAI_API_KEY || 'test_key_for_ci' }}
          LLM_PROVIDER: openai
        shell: bash
        run: |
          pytest tests/ -v \
            --timeout=60 \
            --tb=short \
            --junitxml=test-results.xml \
            --cov=agent --cov=collector --cov=inference \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -x

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: |
            test-results.xml
            coverage.xml
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 3 — MODEL VALIDATION
  # ═══════════════════════════════════════════════════════════════════════
  model-validation:
    name: "🧠 Model Validation"
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-model-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-model-

      - name: Install ML deps
        run: pip install --upgrade pip tensorflow numpy joblib scikit-learn pytest pytest-timeout

      - name: Run model validation
        run: pytest tests/test_model_validation.py -v --timeout=120 --tb=short -x

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 4 — INTEGRATION TESTS
  # ═══════════════════════════════════════════════════════════════════════
  integration-tests:
    name: "🔗 Integration Tests"
    runs-on: ubuntu-latest
    needs: [unit-tests, model-validation]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-integ-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-integ-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-timeout

      - name: Create data directory
        run: mkdir -p data

      - name: Run integration tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' && secrets.OPENAI_API_KEY || 'test_key_for_ci' }}
          LLM_PROVIDER: openai
        run: pytest tests/test_integration.py -v --timeout=120 --tb=short -x

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 5a — DOCKER BUILD (backend)
  # Runs in parallel with stage 5b after code-quality passes
  # ═══════════════════════════════════════════════════════════════════════
  build-docker:
    name: "🐳 Docker Build"
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - uses: actions/checkout@v4

      # Docker layer cache — avoids reinstalling TensorFlow on every run
      - uses: docker/setup-buildx-action@v3

      - uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile','requirements.txt') }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: network-troubleshooter-backend:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to:   type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Rotate cache (prevents unbounded growth)
      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 5b — NEXT.JS BUILD (frontend)
  # Runs in parallel with stage 5a
  # ═══════════════════════════════════════════════════════════════════════
  build-frontend:
    name: "⚡ Next.js Build"
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build Next.js app
        working-directory: web
        env:
          # Placeholder so the build doesn't fail on missing env var
          NEXT_PUBLIC_API_URL: https://placeholder.hf.space
        run: npm run build

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 6a — DEPLOY BACKEND → Hugging Face Spaces
  # Only on push to main, after all tests + builds pass
  # ═══════════════════════════════════════════════════════════════════════
  deploy-backend:
    name: "🚀 Deploy → HF Spaces"
    runs-on: ubuntu-latest
    needs: [integration-tests, build-docker, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Push clean snapshot to Hugging Face Space
        env:
          HF_TOKEN:      ${{ secrets.HF_TOKEN }}
          HF_USERNAME:   ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          # Build a fresh git repo with no history so HF never sees large files
          # from old commits. Only copy what the backend container actually needs.
          mkdir -p /tmp/hf-deploy
          rsync -a $GITHUB_WORKSPACE/ /tmp/hf-deploy/ \
            --exclude='.git' \
            --exclude='web/' \
            --exclude='data/*.npy' \
            --exclude='data/*.csv' \
            --exclude='data/*.log' \
            --exclude='data/alerts.json' \
            --exclude='data/agent_state.json' \
            --exclude='data/agent_log.json' \
            --exclude='data/live_metrics.json' \
            --exclude='*.ipynb' \
            --exclude='__pycache__' \
            --exclude='.venv' \
            --exclude='venv'

          cd /tmp/hf-deploy
          git init -b main
          git config user.email "ci@github.com"
          git config user.name  "GitHub CI"
          git add .
          git commit -m "Deploy from GitHub $GITHUB_SHA"
          git push \
            https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME \
            main --force
          echo "✅ Deployed to → huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME"

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 6b — DEPLOY FRONTEND → Vercel
  # ═══════════════════════════════════════════════════════════════════════
  deploy-frontend:
    name: "🚀 Deploy → Vercel"
    runs-on: ubuntu-latest
    needs: [integration-tests, build-docker, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        working-directory: web
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  # ═══════════════════════════════════════════════════════════════════════
  # PIPELINE REPORT — always runs, summarises all stages
  # ═══════════════════════════════════════════════════════════════════════
  pipeline-report:
    name: "📊 Pipeline Report"
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, model-validation, integration-tests, build-docker, build-frontend]
    if: always()
    steps:
      - name: Write summary
        run: |
          echo "## 📊 Pipeline Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Code Quality    | ${{ needs.code-quality.result    == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Unit Tests      | ${{ needs.unit-tests.result      == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧠 Model Validation| ${{ needs.model-validation.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔗 Integration     | ${{ needs.integration-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Docker Build    | ${{ needs.build-docker.result    == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ Frontend Build  | ${{ needs.build-frontend.result  == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\` | **Branch:** \`${{ github.ref_name }}\` | **Actor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
